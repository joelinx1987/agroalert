name: Configurar AgroAlert como app móvil

on:
  push:
    paths:
      - '.github/workflows/configurar_pwa.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  configurar-pwa:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Aplicar identidad móvil
        run: python configurar_pwa_auto.py

      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py .streamlit/config.toml static/
          if git diff --cached --quiet; then
            echo "Sin cambios pendientes"
            exit 0
          fi
          git commit -m "Aplicar identidad móvil de AgroAlert"
          git push
