name: AgroAlert avisos automáticos

on:
  schedule:
    # GitHub Actions usa UTC. Ejecutamos cada 5 min y scheduler.py convierte a Europe/Madrid.
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: agroalert-daily-email-scheduler
  cancel-in-progress: false

jobs:
  send-daily-reports:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Actualizar selector horario si hace falta
        run: |
          python patch_app_hora.py
          if git diff --quiet; then
            echo "Selector ya actualizado"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app.py
            git commit -m "Permitir hora de aviso con cualquier minuto"
            git push
          fi

      - name: Enviar avisos pendientes
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_SENDER: agroalertsoporte@gmail.com
        run: python scheduler.py
