name: AgroAlert avisos automáticos

on:
  schedule:
    # GitHub Actions usa UTC. Ejecutamos cada 5 min y scheduler.py convierte a Europe/Madrid.
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: agroalert-daily-email-scheduler
  cancel-in-progress: false

jobs:
  send-daily-reports:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Enviar avisos pendientes
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_SENDER: agroalertsoporte@gmail.com
        run: python scheduler.py
