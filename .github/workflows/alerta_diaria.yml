name: Bot Telegram Diario AgroAlert

on:
  schedule:
    # 4:45 AM en horario peninsular español (en invierno UTC+1 son las 03:45 UTC / en verano UTC+2 son las 02:45 UTC)
    # Si prefieres las 4:45 de la madrugada (hora UTC pura): '45 4 * * *'
    - cron: '45 4 * * *'
  workflow_dispatch:

jobs:
  enviar-alerta:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: |
          pip install pandas

      - name: Ejecutar bot matutino
        run: |
          python bot_diario.py
