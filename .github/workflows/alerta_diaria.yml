name: Bot WhatsApp Diario AgroAlert

on:
  schedule:
    # 4:45 AM hora peninsular (España usa UTC+1 en invierno y UTC+2 en verano)
    # Configurado en UTC (ej: 2:45 UTC en verano / 3:45 UTC en invierno). 
    # O usa directamente el soporte de zona horaria de GitHub Actions:
    - cron: '45 4 * * *'
      timezone: 'Europe/Madrid'
  workflow_dispatch:

jobs:
  enviar-alerta:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: |
          pip install pandas

      - name: Ejecutar bot matutino
        run: |
          python bot_diario.py
