name: Bot WhatsApp Diario AgroAlert

on:
  schedule:
    # 11:45 AM hora peninsular española gracias a timezone: Europe/Madrid
    - cron: '45 11 * * *'
    timezone: 'Europe/Madrid'
  workflow_dispatch:

jobs:
  enviar-alerta:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: |
          pip install pandas

      - name: Ejecutar bot matutino
        run: |
          python bot_diario.py
