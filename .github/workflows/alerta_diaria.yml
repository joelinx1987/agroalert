name: Bot Telegram Diario AgroAlert

on:
  schedule:
    - cron: '45 4 * * *'
  workflow_dispatch:

jobs:
  enviar-alerta:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: |
          pip install pandas

      - name: Ejecutar bot matutino
        run: |
          python bot_diario.py
