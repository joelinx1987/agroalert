name: Bot WhatsApp Diario AgroAlert

on:
  schedule:
    # 55 9 * * * en UTC equivale exactamente a las 11:55 AM en España (horario de verano)
    - cron: '55 9 * * *'
  workflow_dispatch:

jobs:
  enviar-alerta:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: |
          pip install pandas

      - name: Ejecutar bot matutino
        run: |
          python bot_diario.py
